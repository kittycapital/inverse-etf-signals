<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inverse ETF Volume Spike Signals - Real-time Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e27;
            --bg-card: #141932;
            --bg-elevated: #1a1f3a;
            --text-primary: #e8eaf6;
            --text-secondary: #9fa8da;
            --text-muted: #5c6ac4;
            --accent-bull: #00e676;
            --accent-bear: #ff1744;
            --accent-warning: #ffd600;
            --accent-neutral: #7c4dff;
            --border: #2a2f4a;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--bg-card) 100%);
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-bull) 0%, var(--accent-neutral) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
        }

        .tab {
            font-family: 'JetBrains Mono', monospace;
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab:hover {
            background: var(--bg-elevated);
            border-color: var(--accent-neutral);
            transform: translateY(-2px);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--accent-neutral), var(--accent-bull));
            border-color: var(--accent-neutral);
            color: white;
            box-shadow: 0 4px 20px rgba(124, 77, 255, 0.3);
        }

        /* Controls */
        .controls {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: block;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .radio-option input[type="radio"]:checked {
            border-color: var(--accent-neutral);
            background: var(--accent-neutral);
        }

        .radio-option input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .radio-option label {
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
        }

        /* Slider */
        .slider-container {
            margin-top: 10px;
        }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-elevated);
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-neutral);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(124, 77, 255, 0.5);
            transition: all 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 15px rgba(124, 77, 255, 0.7);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-neutral);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 10px rgba(124, 77, 255, 0.5);
        }

        .slider-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-neutral);
            min-width: 50px;
            text-align: right;
        }

        /* Status Card */
        .status-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .status-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .zscore-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .zscore-item {
            background: var(--bg-elevated);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .zscore-item .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .zscore-item .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .zscore-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .zscore-indicator.green {
            background: var(--accent-bull);
            box-shadow: 0 0 10px var(--accent-bull);
        }

        .zscore-indicator.yellow {
            background: var(--accent-warning);
            box-shadow: 0 0 10px var(--accent-warning);
        }

        .zscore-indicator.red {
            background: var(--accent-bear);
            box-shadow: 0 0 10px var(--accent-bear);
        }

        /* Signal Alert */
        .signal-alert {
            background: linear-gradient(135deg, rgba(255, 23, 68, 0.1) 0%, rgba(124, 77, 255, 0.1) 100%);
            border: 2px solid var(--accent-bear);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .signal-alert.active {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 23, 68, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 23, 68, 0.6); }
        }

        .signal-alert .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .signal-alert .message {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .signal-alert .detail {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .signal-alert.no-signal {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.05) 0%, rgba(124, 77, 255, 0.05) 100%);
            border-color: var(--border);
        }

        /* Chart Container */
        .chart-container {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            height: 400px;
        }

        .chart-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Watermark */
        .watermark {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .watermark a {
            color: var(--accent-neutral);
            text-decoration: none;
            font-weight: 600;
        }

        .watermark a:hover {
            text-decoration: underline;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🎯 INVERSE ETF VOLUME SPIKE SIGNALS</h1>
            <div class="subtitle">Real-time Panic Detection System</div>
        </div>
    </div>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" data-asset="SPY">S&P 500 (SPY)</div>
            <div class="tab" data-asset="QQQ">Nasdaq-100 (QQQ)</div>
            <div class="tab" data-asset="DIA">Dow Jones (DIA)</div>
            <div class="tab" data-asset="IWM">Russell 2000 (IWM)</div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label class="control-label">Z-Score 계산 기간</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" name="period" value="20" id="period-20">
                        <label for="period-20">20일</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="period" value="60" id="period-60" checked>
                        <label for="period-60">60일</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="period" value="120" id="period-120">
                        <label for="period-120">120일</label>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">2x 인버스 ETF 임계값</label>
                <div class="slider-container">
                    <div class="slider-wrapper">
                        <input type="range" min="1.0" max="3.0" step="0.1" value="1.5" class="slider" id="threshold-2x">
                        <div class="slider-value" id="value-2x">1.5</div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">3x 인버스 ETF 임계값</label>
                <div class="slider-container">
                    <div class="slider-wrapper">
                        <input type="range" min="1.0" max="3.0" step="0.1" value="1.5" class="slider" id="threshold-3x">
                        <div class="slider-value" id="value-3x">1.5</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Card -->
        <div class="status-card">
            <div class="status-title">현재 Z-Score 상태</div>
            <div class="zscore-grid">
                <div class="zscore-item">
                    <div class="label" id="label-2x">SDS (2x Short)</div>
                    <div class="value">
                        <span class="zscore-indicator green"></span>
                        <span id="zscore-2x">0.0σ</span>
                    </div>
                </div>
                <div class="zscore-item">
                    <div class="label" id="label-3x">SPXU (3x Short)</div>
                    <div class="value">
                        <span class="zscore-indicator green"></span>
                        <span id="zscore-3x">0.0σ</span>
                    </div>
                </div>
            </div>

            <div class="signal-alert no-signal" id="signal-status">
                <div class="icon">⏳</div>
                <div class="message">데이터 로딩 중...</div>
                <div class="detail">잠시만 기다려주세요</div>
            </div>
        </div>

        <!-- Chart -->
        <div class="chart-container">
            <div class="chart-title">최근 30일 가격 & Z-Score 추이</div>
            <canvas id="priceChart"></canvas>
        </div>
    </div>

    <div class="watermark">
        Powered by <a href="https://herdvibe.com" target="_blank">Herdvibe.com</a> | Market Panic Detection Tool
    </div>

    <script>
        // 전역 변수
        let currentAsset = 'SPY';
        let period = 60;
        let threshold2x = 1.5;
        let threshold3x = 1.5;
        let allData = {};
        let chart = null;

        // ETF 매핑
        const etfMapping = {
            'SPY': { '2x': 'SDS', '3x': 'SPXU' },
            'QQQ': { '2x': 'QID', '3x': 'SQQQ' },
            'DIA': { '2x': 'DOG', '3x': 'SDOW' },
            'IWM': { '2x': 'RWM', '3x': 'TZA' }
        };

        // 데이터 로드
        async function loadData() {
            const assets = ['SPY', 'QQQ', 'DIA', 'IWM'];
            const etfs = ['SDS', 'QID', 'DOG', 'RWM', 'SPXU', 'SQQQ', 'SDOW', 'TZA'];
            
            for (const asset of assets) {
                allData[asset] = await loadCSV(asset);
            }
            
            for (const etf of etfs) {
                allData[etf] = await loadCSV(etf + '_cleaned');
            }
            
            updateDashboard();
        }

        // CSV 로드
        async function loadCSV(name) {
            try {
                const response = await fetch(name + '.csv');
                const text = await response.text();
                const lines = text.trim().split('\n');
                const data = [];
                
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(',');
                    if (parts.length >= 6) {
                        data.push({
                            date: parts[0].trim(),
                            close: parseFloat(parts[1]),
                            high: parseFloat(parts[2]),
                            low: parseFloat(parts[3]),
                            open: parseFloat(parts[4]),
                            volume: parseInt(parts[5])
                        });
                    }
                }
                
                // 날짜 기준으로 정렬
                data.sort((a, b) => new Date(a.date) - new Date(b.date));
                
                console.log(`Loaded ${name}: ${data.length} rows, ${data[0]?.date} to ${data[data.length-1]?.date}`);
                return data;
            } catch (error) {
                console.error(`Error loading ${name}:`, error);
                return [];
            }
        }

        // Z-Score 계산
        function calculateZScore(data, windowSize) {
            const result = [];
            
            for (let i = windowSize; i < data.length; i++) {
                const window = data.slice(i - windowSize, i);
                const dollarVolumes = window.map(d => d.volume * d.close);
                
                const mean = dollarVolumes.reduce((a, b) => a + b, 0) / dollarVolumes.length;
                const variance = dollarVolumes.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / dollarVolumes.length;
                const stdDev = Math.sqrt(variance);
                
                const currentDollarVolume = data[i].volume * data[i].close;
                const zScore = stdDev === 0 ? 0 : (currentDollarVolume - mean) / stdDev;
                
                result.push({
                    date: data[i].date,
                    close: data[i].close,
                    volume: data[i].volume,
                    zScore: zScore
                });
            }
            
            console.log(`Z-Score calculated: ${result.length} data points`);
            return result;
        }

        // 대시보드 업데이트
        function updateDashboard() {
            const asset = currentAsset;
            const etf2x = etfMapping[asset]['2x'];
            const etf3x = etfMapping[asset]['3x'];
            
            // 레이블 업데이트
            document.getElementById('label-2x').textContent = `${etf2x} (2x Short)`;
            document.getElementById('label-3x').textContent = `${etf3x} (3x Short)`;
            
            // Z-Score 계산
            const data2x = calculateZScore(allData[etf2x], period);
            const data3x = calculateZScore(allData[etf3x], period);
            
            if (data2x.length === 0 || data3x.length === 0) return;
            
            // 최신 Z-Score
            const latest2x = data2x[data2x.length - 1].zScore;
            const latest3x = data3x[data3x.length - 1].zScore;
            
            // Z-Score 표시 업데이트
            updateZScoreDisplay('zscore-2x', latest2x, threshold2x);
            updateZScoreDisplay('zscore-3x', latest3x, threshold3x);
            
            // 신호 상태 업데이트
            updateSignalStatus(latest2x, latest3x);
            
            // 차트 업데이트
            updateChart(asset, data2x, data3x);
        }

        // Z-Score 표시 업데이트
        function updateZScoreDisplay(elementId, zScore, threshold) {
            const element = document.getElementById(elementId);
            const indicator = element.previousElementSibling;
            
            element.textContent = zScore.toFixed(2) + 'σ';
            
            if (zScore >= threshold) {
                indicator.className = 'zscore-indicator red';
            } else if (zScore >= threshold - 0.5) {
                indicator.className = 'zscore-indicator yellow';
            } else {
                indicator.className = 'zscore-indicator green';
            }
        }

        // 신호 상태 업데이트
        function updateSignalStatus(z2x, z3x) {
            const alertBox = document.getElementById('signal-status');
            const isSignal = z2x >= threshold2x && z3x >= threshold3x;
            
            if (isSignal) {
                alertBox.className = 'signal-alert active';
                alertBox.innerHTML = `
                    <div class="icon">🚨</div>
                    <div class="message">신호 발생!</div>
                    <div class="detail">2x: ${z2x.toFixed(2)}σ | 3x: ${z3x.toFixed(2)}σ | 조건: 둘 다 ≥${threshold2x.toFixed(1)}σ</div>
                `;
            } else {
                alertBox.className = 'signal-alert no-signal';
                alertBox.innerHTML = `
                    <div class="icon">✅</div>
                    <div class="message">신호 없음</div>
                    <div class="detail">조건 미충족 (2x≥${threshold2x.toFixed(1)}σ AND 3x≥${threshold3x.toFixed(1)}σ)</div>
                `;
            }
        }

        // 차트 업데이트
        function updateChart(asset, data2x, data3x) {
            // 최근 30개 데이터 포인트
            const recent2x = data2x.slice(-30);
            const recent3x = data3x.slice(-30);
            const recentAsset = allData[asset].slice(-30);
            
            const labels = recent2x.map(d => d.date);
            
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: asset + ' Price',
                            data: recentAsset.map(d => d.close),
                            borderColor: '#7c4dff',
                            backgroundColor: 'rgba(124, 77, 255, 0.1)',
                            borderWidth: 2,
                            yAxisID: 'y',
                            tension: 0.3
                        },
                        {
                            label: etfMapping[asset]['2x'] + ' Z-Score',
                            data: recent2x.map(d => d.zScore),
                            borderColor: '#ffd600',
                            backgroundColor: 'rgba(255, 214, 0, 0.1)',
                            borderWidth: 2,
                            yAxisID: 'y1',
                            tension: 0.3
                        },
                        {
                            label: etfMapping[asset]['3x'] + ' Z-Score',
                            data: recent3x.map(d => d.zScore),
                            borderColor: '#ff1744',
                            backgroundColor: 'rgba(255, 23, 68, 0.1)',
                            borderWidth: 2,
                            yAxisID: 'y1',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#9fa8da',
                                font: {
                                    family: 'JetBrains Mono'
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(20, 25, 50, 0.95)',
                            titleColor: '#e8eaf6',
                            bodyColor: '#9fa8da',
                            borderColor: '#2a2f4a',
                            borderWidth: 1,
                            titleFont: {
                                family: 'JetBrains Mono'
                            },
                            bodyFont: {
                                family: 'JetBrains Mono'
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#9fa8da',
                                font: {
                                    family: 'JetBrains Mono',
                                    size: 10
                                }
                            },
                            grid: {
                                color: 'rgba(42, 47, 74, 0.5)'
                            }
                        },
                        y: {
                            type: 'linear',
                            position: 'left',
                            ticks: {
                                color: '#7c4dff',
                                font: {
                                    family: 'JetBrains Mono'
                                }
                            },
                            grid: {
                                color: 'rgba(42, 47, 74, 0.5)'
                            },
                            title: {
                                display: true,
                                text: 'Price',
                                color: '#7c4dff',
                                font: {
                                    family: 'JetBrains Mono'
                                }
                            }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            ticks: {
                                color: '#ff1744',
                                font: {
                                    family: 'JetBrains Mono'
                                }
                            },
                            grid: {
                                drawOnChartArea: false
                            },
                            title: {
                                display: true,
                                text: 'Z-Score',
                                color: '#ff1744',
                                font: {
                                    family: 'JetBrains Mono'
                                }
                            }
                        }
                    }
                }
            });
        }

        // 이벤트 리스너
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentAsset = tab.dataset.asset;
                updateDashboard();
            });
        });

        document.querySelectorAll('input[name="period"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                period = parseInt(e.target.value);
                updateDashboard();
            });
        });

        document.getElementById('threshold-2x').addEventListener('input', (e) => {
            threshold2x = parseFloat(e.target.value);
            document.getElementById('value-2x').textContent = threshold2x.toFixed(1);
            updateDashboard();
        });

        document.getElementById('threshold-3x').addEventListener('input', (e) => {
            threshold3x = parseFloat(e.target.value);
            document.getElementById('value-3x').textContent = threshold3x.toFixed(1);
            updateDashboard();
        });

        // 초기 로드
        loadData();
    </script>
</body>
</html>
